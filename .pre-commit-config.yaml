repos:
# Official repo for default hooks
- repo: https://github.com/precice/precice-pre-commit-hooks
  rev: 'v3.3'
  hooks:
  - id: format-precice-config
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.30.0
  hooks:
    - id: markdownlint
      exclude: 'CHANGELOG.md|.github/*'
    - id: markdownlint-fix
      exclude: 'CHANGELOG.md|.github/*'
